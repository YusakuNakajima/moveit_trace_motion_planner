/**:
  ros__parameters:
    planning_pipelines:
      pipeline_names: ["trace_motion_planner"]

    default_planning_pipeline: "trace_motion_planner"

    trace_motion_planner:
      planning_plugin: "moveit_trace_motion_planner/TracePlannerManager"
      request_adapters: >-
        default_planner_request_adapters/ResolveConstraintFrames
        default_planner_request_adapters/FixWorkspaceBounds
        default_planner_request_adapters/FixStartStateBounds
        default_planner_request_adapters/FixStartStateCollision
        default_planner_request_adapters/AddTimeOptimalParameterization
      start_state_max_bounds_error: 0.1
      planner_id: "TraceMotion"

      trace_planner:
        max_planning_time: 1.0
        max_waypoints: 40
        waypoint_source:
          use_joint_positions: true
          use_link_directions: true
          skip_base_link: true
          skip_tip_link: false
          add_offset_waypoints: true
          offset_distance: 0.08
        ik:
          type: "moveit_ik"
          timeout: 0.02
          attempts: 3
          try_alternate_seeds: true
        direction_ik:
          enabled: true
          max_iterations: 80
          timeout: 0.02
          damping: 0.05
          step_size: 0.6
          position_tolerance: 0.005
          direction_tolerance: 0.02
          max_joint_update: 0.15
        interpolation:
          type: "linear"
          max_joint_step: 0.03
        trajectory:
          waypoint_duration: 0.1
        collision:
          check_self_collision: true
          check_scene_collision: true
        shift_motion:
          enabled: false
          auto_enable_if_dof_ge: 7
          strategy: "joint_sampling"
          delta: 0.2
          samples: 5
        postprocess:
          path_pruning: false
          spline_smoothing: false
          time_parameterization: true
        fallback:
          enabled: false
          planner_id: "RRTConnectkConfigDefault"
